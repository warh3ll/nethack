name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Downloadable from the run's summary page. Unzip and upload as-is to itch.io (HTML5).
      - uses: actions/upload-artifact@v4
        with:
          name: nethack-web
          path: dist/
