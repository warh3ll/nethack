<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No pinch zoom / double-tap zoom, and draw under notches (the game insets itself via the safe-area padding below). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>nethack</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
      /* Touch: no scrolling, pull-to-refresh, text selection or long-press menu while steering. */
      html, body, #game { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* Keep the HUD and skill bar clear of phone notches and the home indicator. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      /* Save code dialog: plain HTML so codes can be pasted, which also means undoing the touch and selection locks above. */
      .save-dialog {
        position: fixed;
        inset: 0;
        display: flex;
        padding: 16px;
        box-sizing: border-box;
        overflow-y: auto;
        background: rgba(5, 6, 10, 0.85);
        color: #c8f7ff;
        font: 15px monospace;
        touch-action: auto;
      }
      .save-dialog .panel { width: 100%; max-width: 520px; margin: auto; padding: 20px; box-sizing: border-box; background: #0d1226; border: 2px solid #5a6a99; }
      .save-dialog h2 { margin: 0; color: #2ef2ff; font-size: 22px; }
      .save-dialog label { display: block; margin: 16px 0 6px; color: #7f93b8; }
      .save-dialog textarea {
        display: block;
        width: 100%;
        height: 72px;
        padding: 8px;
        box-sizing: border-box;
        resize: none;
        background: #05060a;
        color: #c8f7ff;
        border: 1px solid #5a6a99;
        font: 16px monospace;
        word-break: break-all;
        user-select: text;
        -webkit-user-select: text;
        -webkit-touch-callout: default;
      }
      .save-dialog .row { margin-top: 8px; text-align: right; }
      .save-dialog button { min-width: 110px; min-height: 44px; background: #1a2140; color: #2ef2ff; border: 2px solid #5a6a99; font: 15px monospace; cursor: pointer; }
      .save-dialog button:hover { border-color: #2ef2ff; }
      .save-dialog .status { min-height: 20px; margin-top: 12px; color: #ff2e88; }
      .save-dialog .status.good { color: #5fe08a; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
